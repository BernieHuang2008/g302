<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G302 上传文件</title>
    <link rel="stylesheet" href="/filecenter/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">G302</p>
          <h1>上传文件</h1>
          <p class="lede">先整理文件名和标签，再一次上传到班级文件中心。</p>
        </div>
        <div class="topbar-actions">
          <a class="button button-secondary" href="/filecenter/">返回文件列表</a>
        </div>
      </header>

      <section id="dropArea" class="panel upload-panel">
        <div class="drop-zone" id="dropZone" tabindex="0">
          <div class="drop-icon" aria-hidden="true">↑</div>
          <div>
            <h2>把文件拖到这里</h2>
            <p>也可以点击下面的按钮选择一个或多个文件</p>
          </div>
          <label class="button button-primary file-button">
            选择文件
            <input id="fileInput" type="file" multiple />
          </label>
        </div>

        <form id="uploadForm" class="upload-form">
          <div id="selectedFiles" class="selected-files empty-state">还没有选择文件</div>

          <div id="progressPanel" class="progress-panel" hidden>
            <div class="progress-heading">
              <span id="progressStatus">准备上传</span>
              <strong id="progressPercent">0%</strong>
            </div>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="上传进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>

          <div class="actions">
            <button id="uploadButton" class="button button-primary" type="submit" disabled>上传到服务器</button>
            <span id="uploadStatus" class="status-text" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>

    <template id="fileEditorTemplate">
      <article class="file-editor">
        <div class="file-meta">
          <span class="format-icon upload-format-icon" aria-hidden="true">FILE</span>
          <div class="file-fields">
            <label>文件名</label>
            <input class="display-name" type="text" />
            <p class="file-detail"></p>
          </div>
          <button class="remove-file" type="button" title="移除这个文件" aria-label="移除这个文件">×</button>
        </div>
        <div>
          <span class="filter-label">文件标签</span>
          <div class="tag-row editor-tags"></div>
        </div>
      </article>
    </template>

    <script src="/filecenter/static/upload.js"></script>
  </body>
</html>
