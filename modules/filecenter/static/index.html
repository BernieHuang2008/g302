<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G302 文件列表</title>
    <link rel="stylesheet" href="/filecenter/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">G302</p>
          <h1>文件列表</h1>
          <p class="lede">班级资料按时间整理，点击文件名即可由浏览器决定预览或下载。</p>
        </div>
        <div class="topbar-actions">
          <div class="health" id="fileCount">正在同步</div>
          <a class="button button-primary" href="/filecenter/upload">上传文件</a>
        </div>
      </header>

      <section class="panel filters" aria-label="文件筛选">
        <div class="search-wrap">
          <label for="searchInput">搜索文件</label>
          <input id="searchInput" type="search" placeholder="文件名、时间、标签" autocomplete="off" />
        </div>
        <div>
          <span class="filter-label">按标签筛选</span>
          <div id="tagFilters" class="tag-row"></div>
        </div>
      </section>

      <section id="timeline" class="timeline" aria-live="polite"></section>
    </div>

    <script src="/filecenter/static/app.js"></script>
  </body>
</html>
